services:
  db:
    image: postgres:18
    container_name: DesarrolloV2
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mi_base_local
    ports:
      - "5432:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./server-fastapi
    container_name: server-fastapiV2
    ports:
      - "8000:8000"
    volumes:
      - ./server-fastapi:/app
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/mi_base_local
    depends_on:
      db:
        condition: service_healthy    # ← espera a que db esté sano
